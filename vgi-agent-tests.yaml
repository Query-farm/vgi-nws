  - name: map_raster_at
    reference_sql: "SELECT r.raw_value, r.raster_name, r.valid_at FROM (SELECT min(layer_id) AS layer_id FROM nws.main.map_layers('raster:precip/rfc_gridded_ffg/MapServer') WHERE layer_type = 'Mosaic Layer') l, LATERAL nws.main.map_raster_at('raster:precip/rfc_gridded_ffg/MapServer',l.layer_id,38.0293,-78.4767) r ORDER BY r.raster_id"
  - name: compat_map_raster_at
    reference_sql: "SELECT product_id FROM nws.compat.map_raster_at('raster:precip/rfc_gridded_ffg/MapServer', (SELECT min(layer_id) FROM nws.main.map_layers('raster:precip/rfc_gridded_ffg/MapServer') WHERE layer_type = 'Mosaic Layer'), 38.0293, -78.4767, '{\"max_pages\":100}') ORDER BY product_id"
  - name: map_image_at
    reference_sql: "SELECT valid_from, raw_value, band_index FROM nws.main.map_image_at('raster:air_quality/ndgd_apm25_hr01/ImageServer',38.0293,-78.4767) ORDER BY valid_from, raster_id, band_index"
  - name: compat_map_image_at
    reference_sql: "SELECT product_id FROM nws.compat.map_image_at('raster:air_quality/ndgd_apm25_hr01/ImageServer', 38.0293, -78.4767, '{\"start_time\":\"\"}') ORDER BY product_id"
  - name: flash_flood_guidance_at

  - name: drought_outlook_at
    reference_sql: "SELECT period, category, forecast_date, target_period FROM nws.main.drought_outlook_at(38.0293, -78.4767, period := 'monthly') ORDER BY object_id"
  - name: compat_drought_outlook_at
    reference_sql: "SELECT period FROM nws.compat.drought_outlook_at(38.0293, -78.4767, '{\"period\":\"monthly\"}') ORDER BY period"
  - name: gauges

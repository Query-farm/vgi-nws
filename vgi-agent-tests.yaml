  - name: air_quality_at
    reference_sql: "SELECT pollutant, value, unit, valid_from, issued_at FROM nws.main.air_quality_at(38.0293,-78.4767) ORDER BY valid_from, raster_id"
  - name: compat_air_quality_at
    reference_sql: "SELECT product FROM nws.compat.air_quality_at(38.0293, -78.4767, '{\"product\":\"pm25_1h\"}') ORDER BY product"
  - name: river_at_a_glance
    reference_sql: "SELECT gauge_id, name, flood_statements_json FROM nws.main.river_at_a_glance('RMDV2') ORDER BY gauge_id"
  - name: compat_river_at_a_glance
    reference_sql: "SELECT gauge_id FROM nws.compat.river_at_a_glance('RMDV2', '{\"max_pages\":100}') ORDER BY gauge_id"
  - name: api_endpoints
    reference_sql: "SELECT operation_id, description, parameters_json FROM nws.main.api_endpoints(service := 'aviation') WHERE NOT deprecated ORDER BY operation_id"
  - name: api_rows
    reference_sql: "SELECT record_id, record_json FROM nws.main.api_rows('aviation','metar','{\"ids\":\"KCHO\"}') ORDER BY row_index"
  - name: compat_api_rows
    reference_sql: "SELECT service FROM nws.compat.api_rows('aviation', 'metar', '{\"ids\":\"KCHO\"}', '{\"max_pages\":100}') ORDER BY service"

  - name: precipitation_anomaly_at
    reference_sql: "SELECT metric, value, unit FROM nws.main.precipitation_anomaly_at(38.0293,-78.4767) ORDER BY metric, raster_id"
  - name: snow_analysis_at
    reference_sql: "SELECT variable, value_mm, valid_at FROM nws.main.snow_analysis_at(40,-105) ORDER BY variable, raster_id"
  - name: storm_reports
    reference_sql: "SELECT event, count(*) AS reports FROM nws.main.storm_reports(lookback_hours := 72) GROUP BY event ORDER BY event"
  - name: storm_reports_near
    reference_sql: "SELECT event, magnitude_text, unit, distance_km FROM nws.main.storm_reports_near(38.0293,-78.4767) ORDER BY distance_km, object_id"
  - name: compat_soil_moisture_at

  - name: buoy_products
    reference_sql: "SELECT product, supported, data_url FROM nws.main.buoy_products('44014') ORDER BY product"
  - name: compat_buoy_products
    reference_sql: "SELECT station_id FROM nws.compat.buoy_products('44014', '{\"max_pages\":100}') ORDER BY station_id"

# Optional L3 tasks, one per function path; upstream data can change.
tasks:
  - name: point
    reference_sql: "SELECT office_id, forecast_zone, grid_x, grid_y FROM nws.main.point(38.0293, -78.4767)"
  - name: alerts
    reference_sql: "SELECT event, severity, headline, expires FROM nws.main.alerts(area := 'VA') ORDER BY sent DESC"
  - name: alerts_at
    reference_sql: "SELECT event, headline FROM nws.main.alerts_at(38.0293, -78.4767)"
  - name: alert
    reference_sql: "SELECT d.event, d.headline, d.description FROM nws.main.alerts(area := 'VA') a, LATERAL nws.main.alert(a.id) d LIMIT 5"
  - name: alert_types
    reference_sql: "SELECT event FROM nws.main.alert_types() WHERE event ILIKE '%freeze%' ORDER BY event"
  - name: stations_at
    reference_sql: "SELECT station_id, name, elevation_m FROM nws.main.stations_at(38.0293, -78.4767) ORDER BY station_id"
  - name: station
    reference_sql: "SELECT station_id, name, elevation_m FROM nws.main.station('KCHO')"
  - name: observations
    reference_sql: "SELECT min(temperature_c) AS minimum_c, max(temperature_c) AS maximum_c FROM nws.main.observations('KCHO')"
  - name: latest_observation
    reference_sql: "SELECT observed_at, temperature_c, wind_speed_m_s FROM nws.main.latest_observation('KCHO')"
  - name: forecast
    reference_sql: "SELECT start_time, temperature_c, short_forecast FROM nws.main.forecast(38.0293, -78.4767) ORDER BY start_time"
  - name: forecast_hourly
    reference_sql: "SELECT start_time, temperature_c, short_forecast FROM nws.main.forecast_hourly(38.0293, -78.4767) ORDER BY start_time"
  - name: grid_series
    reference_sql: "SELECT valid_from, valid_to, value, unit FROM nws.main.grid_series(38.0293, -78.4767, variable := 'minTemperature') ORDER BY valid_from"
  - name: products
    reference_sql: "SELECT id, issued_at FROM nws.main.products('AFD', 'LWX') ORDER BY issued_at DESC"
  - name: latest_product
    reference_sql: "SELECT issued_at, product_text FROM nws.main.latest_product('AFD', 'LWX')"
  - name: product
    reference_sql: "SELECT d.product_text FROM nws.main.products('HWO', 'LWX') p, LATERAL nws.main.product(p.id) d LIMIT 1"
  - name: product_types
    reference_sql: "SELECT code, name FROM nws.main.product_types() WHERE name ILIKE '%fire%' ORDER BY code"
  - name: product_locations
    reference_sql: "SELECT office_id, name FROM nws.main.product_locations('AFD') ORDER BY office_id"
  - name: zone
    reference_sql: "SELECT name, geometry_json FROM nws.main.zone('forecast', 'VAZ037')"
  - name: zones
    reference_sql: "SELECT zone_id, name FROM nws.main.zones('fire', state := 'VA') ORDER BY zone_id"
  - name: office
    reference_sql: "SELECT name, website FROM nws.main.office('LWX')"
  - name: briefing
    reference_sql: "SELECT title, download_url FROM nws.main.briefing('LWX')"
  - name: weather_stories
    reference_sql: "SELECT title, download_url FROM nws.main.weather_stories('LWX')"
  - name: glossary
    reference_sql: "SELECT term, definition FROM nws.main.glossary() WHERE term ILIKE '%frost%'"
  - name: gauge
    reference_sql: "SELECT name, state, status_json FROM nws.main.gauge('RMDV2')"
  - name: stageflow
    reference_sql: "SELECT product, max(primary_value) AS peak, primary_unit FROM nws.main.stageflow('RMDV2') GROUP BY product, primary_unit ORDER BY product"
  - name: flood_thresholds
    reference_sql: "SELECT category, stage, stage_unit FROM nws.main.flood_thresholds('RMDV2') ORDER BY stage"
  - name: flood_impacts
    reference_sql: "SELECT stage, stage_unit, statement FROM nws.main.flood_impacts('RMDV2') ORDER BY stage"
  - name: historic_crests
    reference_sql: "SELECT occurred_at, stage, stage_unit, old_datum FROM nws.main.historic_crests('RMDV2') ORDER BY stage DESC LIMIT 5"
  - name: severe_outlook
    reference_sql: "SELECT day, hazard, category, probability_pct, valid_from, valid_to FROM nws.main.severe_outlook(day := 1) ORDER BY object_id"
  - name: severe_outlook_at
    reference_sql: "SELECT day, hazard, category, probability_pct, valid_from, valid_to FROM nws.main.severe_outlook_at(38.0293, -78.4767, day := 1) ORDER BY object_id"
  - name: compat_severe_outlook_at
    reference_sql: "SELECT day FROM nws.compat.severe_outlook_at(38.0293, -78.4767, '{\"day\":1}') ORDER BY day"
  - name: fire_outlook
    reference_sql: "SELECT day, hazard, category, valid_from, valid_to FROM nws.main.fire_outlook(day := 1) ORDER BY object_id"
  - name: fire_outlook_at
    reference_sql: "SELECT day, hazard, category, valid_from, valid_to FROM nws.main.fire_outlook_at(38.0293, -78.4767, day := 1) ORDER BY object_id"
  - name: compat_fire_outlook_at
    reference_sql: "SELECT day FROM nws.compat.fire_outlook_at(38.0293, -78.4767, '{\"day\":1}') ORDER BY day"
  - name: rainfall_outlook

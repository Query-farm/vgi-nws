  - name: compat_river_network
    reference_sql: "SELECT origin_gauge_id FROM nws.compat.river_network('RMDV2', '{\"direction\":\"both\"}') ORDER BY origin_gauge_id"
  - name: parse_valid_time
    reference_sql: "SELECT valid_from, valid_to, duration_hours FROM nws.main.parse_valid_time('2026-01-02T12:00:00Z/PT2H') ORDER BY valid_from"
  - name: precipitation_observed_at

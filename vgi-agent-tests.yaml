    reference_sql: "SELECT office_id, beach_name, has_forecast, rip_current_risk, surf_text, water_temperature_text FROM nws.main.beach_forecast_at(38.0293, -78.4767) ORDER BY object_id"
  - name: compat_beach_forecast_at

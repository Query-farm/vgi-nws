  - name: winter_precipitation_at
    reference_sql: "SELECT hazard, threshold_inches, category, probability_min_pct, probability_max_pct, valid_from FROM nws.main.winter_precipitation_at(38.0293, -78.4767, day := 1) ORDER BY object_id"
  - name: compat_winter_precipitation_at

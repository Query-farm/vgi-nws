  - name: gauges_near
    reference_sql: "SELECT gauge_id, name, distance_km FROM nws.main.gauges_near(37.5407, -77.4360, radius_km := 50) ORDER BY distance_km, gauge_id"
  - name: compat_gauges_near
    reference_sql: "SELECT gauge_id FROM nws.compat.gauges_near(37.5407, -77.4360, '{\"radius_km\":50}') ORDER BY gauge_id"
  - name: river_network

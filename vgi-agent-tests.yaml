  - name: rainfall_outlook_at
    reference_sql: "SELECT day, category, risk_description, valid_from, valid_to FROM nws.main.rainfall_outlook_at(38.0293, -78.4767, day := 1) ORDER BY object_id"
  - name: compat_rainfall_outlook_at
    reference_sql: "SELECT day FROM nws.compat.rainfall_outlook_at(38.0293, -78.4767, '{\"day\":1}') ORDER BY day"
  - name: precipitation_forecast
    reference_sql: "SELECT period, contour_value, unit, valid_from, valid_to FROM nws.main.precipitation_forecast(period := 'day1') ORDER BY object_id"
  - name: precipitation_forecast_at
    reference_sql: "SELECT period, contour_value, unit, valid_from, valid_to FROM nws.main.precipitation_forecast_at(38.0293, -78.4767, period := 'day1') ORDER BY object_id"
  - name: compat_precipitation_forecast_at
    reference_sql: "SELECT period FROM nws.compat.precipitation_forecast_at(38.0293, -78.4767, '{\"period\":\"day1\"}') ORDER BY period"
  - name: climate_outlook
    reference_sql: "SELECT variable, category, probability_pct, valid_from, valid_to FROM nws.main.climate_outlook(period := '8_14_day') ORDER BY object_id"
  - name: climate_outlook_at
    reference_sql: "SELECT variable, category, probability_pct, valid_from, valid_to FROM nws.main.climate_outlook_at(38.0293, -78.4767, period := '8_14_day') ORDER BY object_id"
  - name: compat_climate_outlook_at
    reference_sql: "SELECT period FROM nws.compat.climate_outlook_at(38.0293, -78.4767, '{\"period\":\"8_14_day\"}') ORDER BY period"
  - name: drought_outlook
